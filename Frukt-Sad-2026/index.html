<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Фруктовый сад — режиссёрский тритмент</title>
<style>
  :root{--bg:#f4efe4;--ink:#1f2a1c;--muted:#6b6a5c;--accent:#e2611b}
  @media (prefers-color-scheme:dark){:root{--bg:#141712;--ink:#efe9da;--muted:#9a978a}}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  main{max-width:640px;text-align:center}
  .k{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(40px,9vw,84px);line-height:1;margin:18px 0 22px;font-weight:700}
  h1 span{color:var(--accent)}
  p{color:var(--muted);font-size:17px;line-height:1.5}
  a{color:inherit}
</style>
</head>
<body>
<main>
  <div class="k">Режиссёрский тритмент</div>
  <h1>Фруктовый <span>сад</span></h1>
  <p>Страница готовится.<br><a href="https://mubinov.uz">Damir Mubinov</a> · Film Director</p>
</main>
</body>
</html>
