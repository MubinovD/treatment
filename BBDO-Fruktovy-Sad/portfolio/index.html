<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Дамир Мубинов — работы</title>
<meta property="og:title" content="Дамир Мубинов — работы">
<meta property="og:description" content="Режиссёр-постановщик рекламных роликов: рекламная комедия и стоп-моушен">
<meta property="og:image" content="https://treatment.mubinov.uz/BBDO-Fruktovy-Sad/a/og-shelf.jpg">
<meta name="theme-color" content="#111112">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://player.vimeo.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--ink:#EDECE8;--soft:#A6A5A0;--muted:#6F6E6A;--paper:#111112;--line:#26262A;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Onest',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
a{color:inherit}
.page{max-width:1120px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,40px) clamp(40px,6vw,80px)}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;transition:color .2s}
.back:hover{color:var(--ink)}
header{margin:clamp(36px,6vw,72px) 0 clamp(28px,4vw,44px);max-width:46ch}
h1{font-weight:600;font-size:clamp(30px,3.6vw,46px);line-height:1.1;letter-spacing:-.02em;color:var(--ink);margin-bottom:14px}
header p{font-size:clamp(17px,1.35vw,19px);color:var(--soft);text-wrap:pretty}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.2vw,28px)}
.v{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#1C1C1E}
.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.v.empty{display:grid;place-items:center;color:var(--muted);font-size:14px;font-weight:700}
.big{margin-bottom:clamp(14px,2vw,28px)}
.big h2{font-weight:600;font-size:clamp(17px,1.5vw,21px);color:var(--ink);margin-bottom:12px;letter-spacing:-.01em}
.cap{margin-top:10px;font-size:14px;color:var(--soft);font-weight:500}
.more{margin-top:clamp(40px,6vw,72px);padding-top:22px;border-top:1px solid var(--line);font-size:clamp(16px,1.3vw,19px)}
footer{margin-top:14px;font-weight:500;display:flex;flex-wrap:wrap;gap:12px 28px;font-size:15px}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--muted);padding-bottom:2px}
footer a:hover{border-color:var(--ink)}
[data-r]{opacity:0;transform:translateY(16px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
[data-r].in{opacity:1;transform:none}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){[data-r]{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="page">
  <a class="back" href="../">← К тритменту</a>
  <header data-r>
    <h1>Привет!</h1>
    <p>Меня зовут Дамир Мубинов, я режиссёр-постановщик рекламных роликов. Работаю в жанрах рекламной комедии и стоп-моушена. Вот некоторые из моих работ:</p>
  </header>
  <div class="grid" id="grid"></div>
  <p class="more" data-r>Полный список работ — на моём сайте и в Vimeo:</p>
  <footer data-r>
    <a href="https://mubinov.uz" target="_blank" rel="noopener">mubinov.uz</a>
    <a id="vimeoLink" href="https://vimeo.com/" target="_blank" rel="noopener">vimeo.com/mubinov</a>
  </footer>
</div>
<script>
// Заполнить: id ролика Vimeo (число из ссылки vimeo.com/123456789) и подпись. Для приватных ссылок вида vimeo.com/123/abcd — h: 'abcd'.
var WORKS=[
  {id:'1242066009',h:'',title:'TIM Sherin — Stop Motion',big:true},
  {id:'1239310885',h:'',title:'7UP — Heat',big:true},
  {id:'1129838763',h:'',title:'MASELKO — Just Like Childhood'},
  {id:'1239311006',h:'',title:'Bir-Bir — Musical'}
];
var VIMEO_PROFILE='https://vimeo.com/mubinov';
(function(){
  var g=document.getElementById('grid');
  WORKS.forEach(function(w,i){
    var c=document.createElement('div'); c.setAttribute('data-r',''); c.style.setProperty('--d',(0.08*i+0.1)+'s'); if(w.big){c.className='big'; var h=document.createElement('h2'); h.textContent=w.title; c.appendChild(h);}
    var box=document.createElement('div'); box.className='v'+(w.id?'':' empty');
    if(w.id){ var f=document.createElement('iframe'); f.loading='lazy'; f.allow='autoplay; fullscreen; picture-in-picture'; f.allowFullscreen=true; f.title=w.title||'Работа '+(i+1);
      f.src='https://player.vimeo.com/video/'+w.id+'?'+(w.h?'h='+w.h+'&':'')+'dnt=1&title=0&byline=0&portrait=0'; box.appendChild(f); }
    else box.textContent='Скоро';
    c.appendChild(box);
    if(w.title&&!w.big){ var p=document.createElement('p'); p.className='cap'; p.textContent=w.title; c.appendChild(p); }
    g.appendChild(c);
  });
  if(VIMEO_PROFILE) document.getElementById('vimeoLink').href=VIMEO_PROFILE;
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});
  document.querySelectorAll('[data-r]').forEach(function(el){io.observe(el)});
})();
</script>
</body>
</html>
